            border-image: url('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmo.jpg') 30 round;
            border-radius: 2px;
            height: 100%;
            width: 100%;
            box-shadow: 0 0 80px rgba(0, 0, 0, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .book-header {
            padding: 30px;
            border-bottom: 3px solid #5d4037;
            background: rgba(93, 64, 55, 0.1);
        }

        .book-body {
            padding: 40px;
            font-size: 1.3rem;
            color: #4a3219;
            line-height: 2.2;
            text-align: justify;
            font-style: italic;
        }

        .book-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #8b4513;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            z-index: 1001;
        }

        .book-close:hover {
            background: #a0522d;
        }

        /* მობილური კონტროლები - მხოლოდ ტელეფონისთვის */
        #mobile-joystick {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(2, 55px);
            gap: 8px;
            z-index: 500;
        }

        .joy-btn {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            user-select: none;
            backdrop-filter: blur(5px);
        }

        @media (min-width: 1024px) {
            #mobile-joystick {
                display: none;
            }
        }
    </style>

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.4));

        floor.receiveShadow = true;
        scene.add(floor);

        rightWall.position.set(7, 3, 0); rightWall.rotation.y = -Math.PI / 2; scene.add(rightWall);

        const interactables = [];
        const colliders = [];

        function createDesk(x, z) {
            const deskGroup = new THREE.Group();
            const top = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.1, 1.2), new THREE.MeshStandardMaterial({ color: 0x4b2d1f }));
            top.position.y = 1; top.castShadow = true; deskGroup.add(top);
            const createLeg = (lx, lz) => {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 8), new THREE.MeshStandardMaterial({ color: 0x4b2d1f }));
                leg.position.set(lx, 0.5, lz); leg.castShadow = true; deskGroup.add(leg);
            };
            createLeg(1.1, 0.5); createLeg(-1.1, 0.5); createLeg(1.1, -0.5); createLeg(-1.1, -0.5);
            deskGroup.position.set(x, 0, z);
            scene.add(deskGroup);
            colliders.push(new THREE.Box3().setFromObject(deskGroup));
            return deskGroup;
        }

        function createRealBook(parent, dataKey, x = 0, z = 0, color = 0x8b0000, rotY = 0) {
            const bookGroup = new THREE.Group();
            const coverMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 });
            const cover = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.7), coverMat);
            cover.position.y = 1.1; cover.castShadow = true;
            const pagesMat = new THREE.MeshStandardMaterial({ color: 0xfdf6e3, roughness: 1 });
            const pages = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.08, 0.68), pagesMat);
            pages.position.set(0, 1.1, 0);
            bookGroup.add(cover, pages);
            bookGroup.position.set(x, 0, z);
            bookGroup.rotation.y = rotY;
            bookGroup.userData = { content: museumContent[dataKey] };
            parent.add(bookGroup);
            interactables.push(pages);
            pages.userData = bookGroup.userData;
            return bookGroup;
        }

        // შესწორება: კლიკზე რეაგირება
        document.body.addEventListener('click', (e) => {
            if (e.target.id === 'close-button') return;
            if (window.innerWidth > 1024 && !controls.isLocked) controls.lock();
            checkInteraction();
        });

        function checkInteraction() {
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = ray.intersectObjects(interactables);
            if (hits.length > 0) {
                const data = hits[0].object.userData.content;
                document.getElementById('b-title').innerText = data.title;
                document.getElementById('b-subtitle').innerText = data.subtitle;
                document.getElementById('b-body').innerText = data.text;
                document.getElementById('book-viewer').style.display = 'block';
                controls.unlock();
            }
        }

        // შესწორება: დახურვის ღილაკის ლოგიკა
        document.getElementById('close-button').onclick = (e) => {
            e.stopPropagation();
            document.getElementById('book-viewer').style.display = 'none';
            if (window.innerWidth > 1024) controls.lock();
        };

        let move = { f: false, b: false, l: false, r: false };
        document.onkeydown = (e) => {
            if (e.code === 'KeyW') move.f = true;
            if (e.code === 'KeyS') move.b = true;
            if (e.code === 'KeyA') move.l = true;
            if (e.code === 'KeyD') move.r = true;
        };
        document.onkeyup = (e) => {
            if (e.code === 'KeyW') move.f = false;
            if (e.code === 'KeyS') move.b = false;
            if (e.code === 'KeyA') move.l = false;
            if (e.code === 'KeyD') move.r = false;
        };

        const bindMob = (id, dir) => {
            const btn = document.getElementById(id);
            btn.ontouchstart = (e) => { e.preventDefault(); move[dir] = true; };
            btn.ontouchend = (e) => { e.preventDefault(); move[dir] = false; };
        };
        bindMob('m-up', 'f'); bindMob('m-down', 'b'); bindMob('m-left', 'l'); bindMob('m-right', 'r');

        let tX = 0, tY = 0;
        renderer.domElement.ontouchmove = (e) => {
            if (e.touches.length === 1) {
                const s = 0.005;
                if (tX !== 0) {
                    camera.rotation.y -= (e.touches[0].pageX - tX) * s;
                    camera.rotation.x -= (e.touches[0].pageY - tY) * s;
                }
                tX = e.touches[0].pageX; tY = e.touches[0].pageY;
            }
        };
        renderer.domElement.ontouchend = () => { tX = 0; tY = 0; };

                const playerBox = new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(0.7, 2, 0.7));
                for (let wall of colliders) {
                    if (playerBox.intersectsBox(wall)) camera.position.copy(oldPos);
                }
                if (Math.abs(camera.position.x) > 6.5 || Math.abs(camera.position.z) > 6.5) camera.position.copy(oldPos);
            }
            renderer.render(scene, camera);
        }
        animate();

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
